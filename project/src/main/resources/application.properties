spring.application.name=StreamFlixTv
server.port=8088
# UPDATED: Changed localhost to 127.0.0.1 and removed default password for XAMPP
# UPDATED: Reverted to 3306 based on netstat, keeping IPv4 and blank password
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/streamflixtv?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

app.jwt.secret=${JWT_SECRET:StreamFlixTvSuperSecretKeyForJWTTokenGeneration2024}
app.jwt.expiration=86400000

spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
app.upload.dir=upload
app.movies.dir=upload/movies

spring.thymeleaf.cache=false

# Watchmode API
watchmode.api-key=${WATCHMODE_API_KEY:hTrKwIZ60cb2uQ7ggIhUuP6te1y4YwUBaQ7jEK97}
watchmode.base-url=https://api.watchmode.com/v1

# TMDB API
tmdb.api-key=${TMDB_API_KEY:}
tmdb.base-url=https://api.themoviedb.org/3

# TMDB image base URL (set via configuration endpoint or hardcoded fallback)
tmdb.image-base-url=https://image.tmdb.org/t/p
