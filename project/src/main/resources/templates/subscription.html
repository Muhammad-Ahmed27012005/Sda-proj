<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Plans')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="container py-5">
  <h1 class="h2 mb-4">Choose Your Plan</h1>
  <div class="row g-4">
    <div class="col-md-4" th:each="plan : ${{'BASIC','STANDARD','PREMIUM'}}">
      <section class="panel plan-card p-4 h-100">
        <h2 class="h4" th:text="${plan}">BASIC</h2>
        <p class="display-6" th:text="${plan == 'BASIC' ? '$7.99' : (plan == 'STANDARD' ? '$11.99' : '$15.99')}">$7.99</p>
        <ul class="text-muted-light">
          <li th:text="${plan == 'BASIC' ? 'SD quality' : (plan == 'STANDARD' ? 'HD quality' : '4K Ultra HD')}">SD quality</li>
          <li>Unlimited watchlist</li>
          <li>Continue watching</li>
        </ul>
        <button class="btn btn-stream w-100 mt-auto" type="button" th:attr="data-plan=${plan}">Subscribe</button>
      </section>
    </div>
  </div>
  <section class="panel p-4 mt-4">
    <h2 class="h5">Payment</h2>
    <div class="d-flex gap-3">
      <label class="form-check">
        <input class="form-check-input" type="radio" name="paymentMethod" value="PAYPAL" checked>
        <span class="form-check-label">PayPal</span>
      </label>
      <label class="form-check">
        <input class="form-check-input" type="radio" name="paymentMethod" value="STRIPE">
        <span class="form-check-label">Stripe</span>
      </label>
    </div>
    <p id="subscription-result" class="mt-3 mb-0 text-muted-light"></p>
  </section>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script th:src="@{/js/subscription.js}"></script>
</body>
</html>
