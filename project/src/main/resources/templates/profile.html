<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Profile')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="container py-5">
  <h1 class="h2 mb-4">Profile</h1>
  <div class="row g-4">
    <section class="col-lg-6">
      <div class="panel p-4">
        <h2 class="h5">Account</h2>
        <input class="form-control mb-3" placeholder="Full name">
        <input class="form-control mb-3" type="file">
        <button class="btn btn-stream">Save</button>
      </div>
    </section>
    <section class="col-lg-6">
      <div class="panel p-4">
        <h2 class="h5">Subscription</h2>
        <p class="text-muted-light mb-3">Plan status appears after subscribing.</p>
        <a class="btn btn-outline-light" th:href="@{/subscribe}">Manage Plan</a>
      </div>
    </section>
  </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
