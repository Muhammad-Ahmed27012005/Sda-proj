<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Movie Details')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main style="padding-top:5.5rem">
  <div class="container-fluid px-4 px-xl-5 py-5" th:if="${error}">
    <div class="alert-error mx-auto" style="max-width:600px" th:text="${error}"></div>
  </div>

  <div id="detail-wrap" th:unless="${error}">

    <div id="detail-backdrop"
         style="min-height:50vh;display:grid;align-items:end;position:relative;overflow:hidden;background:var(--racing-green)">
      <div id="detail-backdrop-img"
           style="position:absolute;inset:0;background-size:cover;background-position:center;opacity:.35">
      </div>
      <div style="position:absolute;inset:0;background:linear-gradient(90deg,rgba(14,14,15,.92) 0%,rgba(14,14,15,.4) 60%,transparent 100%)"></div>
      <div style="position:absolute;bottom:0;left:0;right:0;height:40%;background:linear-gradient(180deg,transparent,var(--off-black))"></div>
      <div class="container-fluid px-4 px-xl-5 pb-5" style="position:relative;z-index:1">
        <p class="eyebrow mb-2" id="detail-genre-year">TMDB Movie</p>
        <h1 id="detail-title" th:text="${movie.title}" style="font-family:var(--display);font-size:clamp(2.5rem,7vw,7rem);line-height:.88;font-weight:900;max-width:14ch;margin-bottom:1.5rem"></h1>
        <div class="d-flex flex-wrap gap-3 align-items-center">
          <a class="btn btn-stream btn-lg px-5" id="detail-play-btn"
             th:href="${'https://vidlink.pro/movie/' + tmdbId}" target="_blank">▶ Stream on VidLink</a>
          <span id="detail-rating-badge" th:if="${movie.vote_average != null}"
                style="font-family:var(--mono);font-size:.75rem;padding:.35rem .85rem;border:1px solid var(--line-strong);border-radius:999px;color:var(--text-muted)">
            ⭐ <span th:text="${#numbers.formatDecimal(movie.vote_average, 1, 1)}"></span>
          </span>
        </div>
      </div>
    </div>

    <div class="container-fluid px-4 px-xl-5 py-5">
      <div class="row g-4">
        <div class="col-lg-8">
          <p class="eyebrow mb-2">Synopsis</p>
          <p id="detail-desc" th:text="${movie.overview}" style="font-size:1.1rem;color:var(--text-muted);line-height:1.8;max-width:680px">—</p>
        </div>
        <div class="col-lg-4">
          <div class="panel p-4">
            <p class="eyebrow mb-3">Details</p>
            <dl style="font-family:var(--mono);font-size:.82rem;margin:0">
              <dt style="color:var(--text-dim);margin-bottom:.2rem">Release Date</dt>
              <dd id="detail-d-year" th:text="${movie.release_date}" style="color:var(--championship-white);margin-bottom:1rem">—</dd>
              <dt style="color:var(--text-dim);margin-bottom:.2rem">Rating</dt>
              <dd id="detail-d-rating" th:text="${movie.vote_average != null ? (movie.vote_average + ' / 10') : '—'}" style="color:var(--championship-white);margin-bottom:0">—</dd>
              <dt style="color:var(--text-dim);margin-bottom:.2rem;margin-top:1rem">Popularity</dt>
              <dd id="detail-d-pop" th:text="${movie.popularity}" style="color:var(--championship-white);margin-bottom:0">—</dd>
            </dl>
          </div>
        </div>
      </div>
    </div>

    <div class="container-fluid px-4 px-xl-5 pb-5">
      <p class="eyebrow mb-3">Watch Now (VidLink Embedded Player)</p>
      <div style="position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:8px;background:#000">
        <iframe th:src="${'https://vidlink.pro/movie/' + tmdbId}"
                style="position:absolute;top:0;left:0;width:100%;height:100%;border:0"
                allowfullscreen
                allow="autoplay; encrypted-media">
        </iframe>
      </div>
    </div>

  </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script th:src="@{/js/watchlist.js}"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const movie = [[${movie}]];
  if (!movie || !movie.id) return;

  if (movie.backdrop_path) {
    document.getElementById('detail-backdrop-img').style.backgroundImage =
      "url('https://image.tmdb.org/t/p/w500" + movie.backdrop_path + "')";
  }

  const title = movie.title || 'Untitled';
  document.getElementById('detail-title').textContent = title;

  const rb = document.getElementById('detail-rating-badge');
  if (rb && movie.vote_average) {
    rb.querySelector('span').textContent = parseFloat(movie.vote_average).toFixed(1);
    rb.style.display = '';
  }

  const wrap = document.getElementById('detail-wrap');
  if (wrap) wrap.hidden = false;
});
</script>
</body>
</html>
