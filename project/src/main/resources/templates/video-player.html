<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Watch | StreamFlixTv</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Playfair+Display:wght@700;800;900&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet" th:href="@{/css/player.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="player-shell">
  <div class="player-stage">
    <section>
      <video id="stream-video" class="stream-player"></video>
      <section class="player-controls">
        <div id="progress" class="progress-wrap"><div id="progress-fill" class="progress-fill"></div></div>
        <div class="control-row">
          <button id="play-toggle" class="icon-btn" type="button" title="Play or pause">Play</button>
          <button id="stop" class="icon-btn" type="button" title="Stop">Stop</button>
          <button id="skip-back" class="icon-btn" type="button" title="Back 10 seconds">-10</button>
          <button id="skip-forward" class="icon-btn" type="button" title="Forward 10 seconds">+10</button>
          <button id="mute" class="icon-btn" type="button" title="Mute">Mute</button>
          <input id="volume" class="form-range w-auto" type="range" min="0" max="1" step="0.05" value="1" aria-label="Volume">
          <select id="speed" class="form-select form-select-sm w-auto" aria-label="Playback speed">
            <option value="0.5">0.5x</option>
            <option value="1" selected>1x</option>
            <option value="1.25">1.25x</option>
            <option value="1.5">1.5x</option>
            <option value="2">2x</option>
          </select>
          <span id="quality-label" class="text-muted-light"></span>
          <span id="timecode" class="ms-auto text-muted-light">0:00 / 0:00</span>
          <button id="fullscreen" class="icon-btn" type="button" title="Fullscreen">Full</button>
        </div>
      </section>
    </section>
    <aside class="player-sidebar">
      <p class="section-kicker">Now Streaming</p>
      <h1 id="player-title">Local Asset</h1>
      <p class="text-muted-light mt-4">Premium player controls, range-request delivery, quality selector, playback speed, watch history integration for signed-in users, and related content posture.</p>
      <div class="mt-5">
        <p class="eyebrow">Subtitles</p>
        <button class="btn btn-outline-light btn-sm" type="button">Off</button>
        <button class="btn btn-outline-light btn-sm" type="button">English</button>
      </div>
    </aside>
  </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script th:src="@{/js/player.js}"></script>
</body>
</html>
