<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Register')}"></head>
<body>
<main class="container min-vh-100 d-flex align-items-center justify-content-center">
  <section class="panel p-4 w-100" style="max-width: 480px;">
    <a class="brand-mark text-decoration-none d-block mb-4" th:href="@{/}">StreamFlixTv</a>
    <h1 class="h3 mb-4">Register</h1>
    <form id="register-form">
      <div class="mb-3">
        <label class="form-label" for="fullName">Full Name</label>
        <input id="fullName" name="fullName" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="email">Email</label>
        <input id="email" name="email" class="form-control" type="email" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="password">Password</label>
        <input id="password" name="password" class="form-control" type="password" required>
      </div>
      <div class="mb-4">
        <label class="form-label" for="confirmPassword">Confirm Password</label>
        <input id="confirmPassword" class="form-control" type="password" required>
      </div>
      <button class="btn btn-stream w-100" type="submit">Create Account</button>
      <p class="mt-3 mb-0 text-muted-light">Already registered? <a th:href="@{/login}">Login</a></p>
    </form>
  </section>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script>
document.getElementById('register-form').addEventListener('submit', async event => {
  event.preventDefault();
  const form = new FormData(event.currentTarget);
  if (form.get('password') !== document.getElementById('confirmPassword').value) {
    alert('Passwords do not match');
    return;
  }
  const data = await apiFetch('/api/auth/register', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ fullName: form.get('fullName'), email: form.get('email'), password: form.get('password') })
  });
  localStorage.setItem('streamflixToken', data.token);
  localStorage.setItem('streamflixUser', JSON.stringify(data));
  window.location.href = '/subscribe';
});
</script>
</body>
</html>
