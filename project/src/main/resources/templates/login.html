<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Login')}"></head>
<body>

<div class="auth-shell">
  <!-- Editorial left panel -->
  <div class="auth-editorial d-none d-lg-flex">
    <div>
      <a class="brand-mark text-decoration-none" th:href="@{/}">StreamFlixTv</a>
      <h1 class="mt-4 mb-0">Watch<br>without<br>limits.</h1>
      <p class="mt-4 text-muted-light" style="max-width:38ch; font-size:1.1rem;">
        Stream thousands of movies and shows in HD and 4K, anytime, anywhere.
      </p>
    </div>
  </div>

  <!-- Form right panel -->
  <div class="auth-form">
    <a class="brand-mark text-decoration-none d-block d-lg-none mb-5" th:href="@{/}">StreamFlixTv</a>

    <h2 class="mb-1" style="font-family:var(--display);font-size:clamp(2rem,4vw,3rem);">Welcome back</h2>
    <p class="text-muted-light mb-4" style="font-family:var(--mono);font-size:0.78rem;text-transform:uppercase;">
      Sign in to your account
    </p>

    <form id="login-form" novalidate>
      <!-- Inline error message -->
      <div class="alert-error form-error-msg mb-3" id="login-error" hidden></div>

      <div class="mb-3">
        <label class="form-label" for="email"
               style="font-family:var(--mono);font-size:0.75rem;text-transform:uppercase;letter-spacing:0.04em;">
          Email
        </label>
        <input id="email" name="email" class="form-control" type="email"
               placeholder="you@example.com" autocomplete="email" required />
      </div>

      <div class="mb-4">
        <label class="form-label d-flex justify-content-between" for="password"
               style="font-family:var(--mono);font-size:0.75rem;text-transform:uppercase;letter-spacing:0.04em;">
          Password
        </label>
        <input id="password" name="password" class="form-control" type="password"
               placeholder="••••••••" autocomplete="current-password" required />
      </div>

      <button class="btn btn-stream w-100 py-2" type="submit" id="login-btn">
        Sign In
      </button>

      <p class="mt-4 mb-0 text-center text-muted-light" style="font-family:var(--mono);font-size:0.78rem;">
        New here? <a th:href="@{/register}" style="color:var(--acid-green);">Create an account</a>
      </p>
    </form>
  </div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script>
  document.getElementById('login-form').addEventListener('submit', async (event) => {
    event.preventDefault();
    const form = event.currentTarget;
    const btn = document.getElementById('login-btn');
    const errorEl = document.getElementById('login-error');

    errorEl.hidden = true;
    btn.disabled = true;
    btn.textContent = 'Signing in…';

    try {
      const data = await apiFetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: form.email.value.trim(),
          password: form.password.value,
        }),
      });
      if (!data || !data.token) {
        throw new Error('Login failed. Please try again.');
      }
      localStorage.setItem('streamflixToken', data.token);
      localStorage.setItem('streamflixUser', JSON.stringify(data));
      window.location.href = data.role === 'ADMIN' ? '/admin' : '/';
    } catch (error) {
      errorEl.textContent = error.message || 'Login failed. Please check your credentials.';
      errorEl.hidden = false;
      btn.disabled = false;
      btn.textContent = 'Sign In';
    }
  });
</script>
</body>
</html>
