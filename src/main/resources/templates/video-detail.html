<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Video Details')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="container py-5">
  <section id="video-detail" class="row g-4 align-items-center"></section>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script th:src="@{/js/watchlist.js}"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const id = location.pathname.split('/').pop();
  const video = await apiFetch(`/api/videos/${id}`);
  const image = video.thumbnailUrl ? `/uploads/${video.thumbnailUrl}` : 'https://images.unsplash.com/photo-1440404653325-ab127d49abc1?auto=format&fit=crop&w=1000&q=80';
  document.getElementById('video-detail').innerHTML = `
    <div class="col-lg-6"><img class="img-fluid rounded" src="${image}" alt="${video.title}"></div>
    <div class="col-lg-6">
      <h1>${video.title}</h1>
      <p class="text-muted-light">${video.genre || 'Movie'} ${video.releaseYear ? ' - ' + video.releaseYear : ''} ${video.rating ? ' - Rating ' + video.rating : ''}</p>
      <p>${video.description || ''}</p>
      <div class="d-flex gap-2">
        <a class="btn btn-light" href="/watch/${video.videoId}">Play</a>
        <button class="btn btn-outline-light" id="watchlist-add">+ Watchlist</button>
      </div>
    </div>`;
  document.getElementById('watchlist-add').addEventListener('click', async () => {
    await addToWatchlist(video.videoId);
    document.getElementById('watchlist-add').textContent = 'Added';
  });
});
</script>
</body>
</html>
