<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('History')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="container py-5">
  <h1 class="h2 mb-4">Watch History</h1>
  <section id="history-list" class="vstack gap-3"></section>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  requireAuth();
  const rows = await apiFetch('/api/history');
  document.getElementById('history-list').innerHTML = rows.map(row => `
    <article class="panel p-3 d-flex justify-content-between align-items-center">
      <span>${row.title}</span>
      <span class="text-muted-light">${row.watchPercentage}%</span>
    </article>
  `).join('');
});
</script>
</body>
</html>
