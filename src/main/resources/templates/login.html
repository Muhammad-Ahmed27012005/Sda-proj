<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/layout :: head('Login')}"></head>
  <body>
    <main
      class="container min-vh-100 d-flex align-items-center justify-content-center"
    >
      <section class="panel p-4 w-100" style="max-width: 440px">
        <a class="brand-mark text-decoration-none d-block mb-4" th:href="@{/}"
          >StreamFlixTv</a
        >
        <h1 class="h3 mb-4">Login</h1>
        <form id="login-form" th:action="@{/login}" method="post">
          <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input
              id="email"
              name="email"
              class="form-control"
              type="email"
              required
            />
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <input
              id="password"
              name="password"
              class="form-control"
              type="password"
              required
            />
          </div>
          <div class="form-check mb-4">
            <input id="remember" class="form-check-input" type="checkbox" />
            <label class="form-check-label" for="remember">Remember me</label>
          </div>
          <button class="btn btn-stream w-100" type="submit">Login</button>
          <p class="mt-3 mb-0 text-muted-light">
            New here? <a th:href="@{/register}">Create an account</a>
          </p>
        </form>
      </section>
    </main>
    <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
    <script>
      document
        .getElementById("login-form")
        .addEventListener("submit", async (event) => {
          event.preventDefault();
          const form = new FormData(event.currentTarget);
          try {
            const data = await apiFetch("/api/auth/login", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                email: form.get("email"),
                password: form.get("password"),
              }),
            });
            localStorage.setItem("streamflixToken", data.token);
            localStorage.setItem("streamflixUser", JSON.stringify(data));
            window.location.href = data.role === "ADMIN" ? "/admin" : "/";
          } catch (error) {
            alert(error.message);
          }
        });
    </script>
  </body>
</html>
